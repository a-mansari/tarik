<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Tarik{% endblock %} · Tarik</title>
  <link rel="stylesheet" href="/ui/static/app.css">
</head>
<body>
  <header class="bar">
    <a class="brand" href="/ui/runs">Tarik</a>
    <nav>
      <a href="/ui/runs" {% if request.url.path.startswith('/ui/runs') %}aria-current="page"{% endif %}>Exécutions</a>
      <a href="/ui/workflows" {% if request.url.path.startswith('/ui/workflows') %}aria-current="page"{% endif %}>Workflows</a>
      <a href="/ui/prompts" {% if request.url.path.startswith('/ui/prompts') %}aria-current="page"{% endif %}>Prompts</a>
      <a href="/ui/contenu" {% if request.url.path.startswith('/ui/contenu') %}aria-current="page"{% endif %}>Contenu</a>
    </nav>
    {% if request.state.user is defined and request.state.user %}
    <form class="who" method="post" action="/logout"><span>{{ request.state.user.name }}</span><button type="submit">Se déconnecter</button></form>
    {% endif %}
  </header>
  <main class="page{% block page_class %}{% endblock %}">
    {% block content %}{% endblock %}
  </main>
  <script src="/ui/static/app.js"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
