# Vault, which holds Tarik's settings and secrets (vault/): the one service the orchestrator (orchestrator/, a stack
# of its own) shares. Its project keeps the name sarnec-n8n: its volume and network are those of the stack it came
# from. The n8n implementation lives on branch main (run from a worktree of it, e.g. ../sarnec-n8n-main, with
# docker compose -p sarnec-n8n); it defines this same Vault service.
services:
  vault:
    image: hashicorp/vault:1.18.3
    restart: unless-stopped
    entrypoint: ["sh", "/vault/config/start.sh"]
    ports:
      - "127.0.0.1:8200:8200" # for the setup scripts on this machine, not the LAN
    volumes:
      - ./vault/config.hcl:/vault/config/config.hcl:ro
      - ./vault/start.sh:/vault/config/start.sh:ro
      - ./vault/setup.sh:/vault/config/setup.sh:ro
      - ./vault/.local/unseal:/vault/unseal # unseal key and root token: this machine only, never in git
      - ./vault/.local/approle:/vault/approle
      - vault_data:/vault/file

volumes:
  vault_data:
