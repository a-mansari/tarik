services:
  n8n:
    build: ./n8n # n8n 2.43.5 with Tarik's patches (n8n/patch.js)
    restart: unless-stopped
    ports:
      - "127.0.0.1:5678:5678" # local only, not exposed on the LAN
    env_file: .env
    # Public resolvers: right after a restart the host's DNS sometimes failed (EAI_AGAIN api.minimax.io).
    # Service names (tarik-mcp, postgres) still resolve through Docker's own DNS.
    dns: [1.1.1.1, 8.8.8.8]
    environment:
      GENERIC_TIMEZONE: Africa/Casablanca
      TZ: Africa/Casablanca
      N8N_HOST: localhost
      N8N_PROTOCOL: http
      WEBHOOK_URL: http://localhost:5678/
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      # How long an agent's workflow tool may run (n8n/patch.js; n8n's own is 2 minutes). Under ask_agent's 600 s
      # wait for an email's answer; Tarik's run budgets (workflows/build_tarik_*.py, READ_WAIT) stay under it.
      TARIK_AGENT_TOOL_TIMEOUT_MS: "300000"
      # n8n's own data (workflows, credentials, agents, conversations, executions) in Postgres, not
      # SQLite: one writer at a time doesn't hold with an agent per cabinet. Uploaded files stay in the volume.
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_DATABASE: ${N8N_POSTGRES_DB}
      DB_POSTGRESDB_USER: ${POSTGRES_USER}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
    depends_on: [postgres]
    volumes:
      - n8n_data:/home/node/.n8n

  # Tarik's Experio tools over MCP, one address per cabinet: http://tarik-mcp:8000/c/<cabinet>/mcp. Not exposed to the host.
  tarik-mcp: &tarik
    build: ./mcp
    restart: unless-stopped
    # Only what Tarik's code reads, never the whole .env: its N8N_ENCRYPTION_KEY would open n8n's credentials
    # to a container that reads strangers' PDFs and emails.
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      ODOO_URL: ${ODOO_URL}
      TARIK_CALLS_PER_CABINET: ${TARIK_CALLS_PER_CABINET:-10}
      TARIK_CALLS_TOTAL: ${TARIK_CALLS_TOTAL:-40}
      N8N_MCP_API_URL: http://n8n:5678/mcp-server/http # n8n as reached on Docker's network, whatever .env says for the host
      VAULT_ADDR: http://vault:8200
    volumes:
      - ./vault/.local/approle:/run/vault:ro # tarik-mcp's AppRole: it may only read secret/tarik/*
      - ./instructions/tools:/instructions/tools:ro # the prompts the tools give the model
    depends_on: [vault]
    dns: [1.1.1.1, 8.8.8.8]

  # Wakes "Tarik - Emails" for each cabinet with a Tarik mailbox: as soon as an email arrives (IMAP IDLE),
  # and every 15 minutes in case one was missed. Each wake-up names its cabinet (mcp/watcher.py).
  tarik-mail-watch:
    <<: *tarik
    command: ["python", "watcher.py"]

  # Tarik's data (database POSTGRES_DB: one schema per cabinet, mcp/tarik/core/cabinet.sql) and n8n's own
  # (database N8N_POSTGRES_DB). Not exposed to the host.
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      N8N_POSTGRES_DB: ${N8N_POSTGRES_DB} # for the setup's createdb (README)
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # Tarik's secrets and per-cabinet settings (vault/): secret/tarik/shared and secret/tarik/cabinets/<cabinet>.
  # Local only, unsealed at start by vault/start.sh; on the public server, a real Vault takes its place.
  vault:
    image: hashicorp/vault:1.18.3
    restart: unless-stopped
    entrypoint: ["sh", "/vault/config/start.sh"]
    ports:
      - "127.0.0.1:8200:8200" # for the setup scripts on this machine, not the LAN
    volumes:
      - ./vault/config.hcl:/vault/config/config.hcl:ro
      - ./vault/start.sh:/vault/config/start.sh:ro
      - ./vault/setup.sh:/vault/config/setup.sh:ro
      - ./vault/.local/unseal:/vault/unseal # unseal key and root token: this machine only, never in git
      - ./vault/.local/approle:/vault/approle
      - vault_data:/vault/file

volumes:
  n8n_data:
  postgres_data:
  vault_data:
