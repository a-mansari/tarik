# Tarik: the server (the graphs, the agent, the tools, the mail watcher, the UI), its Postgres (runs, conversations,
# each cabinet's schema) and Vault (Tarik's settings and secrets, vault/; read-only for the server). Its .env (from
# .env.example, never in git) gives POSTGRES_PASSWORD and ODOO_URL:
#   docker compose up --build -d
# The project keeps the name sarnec-n8n, and the database its volume: the names of the stacks they came from. The n8n
# implementation lives on branch main (run from a worktree of it with docker compose -p sarnec-n8n); it shares this
# Vault and this network, and its services show here as orphans: never pass --remove-orphans.
name: sarnec-n8n

services:
  server:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:2024:2024" # server.py, local only
    environment:
      VAULT_ADDR: http://vault:8200
      TARIK_DEFAULT_CABINET: experio_cabinet_8
      ODOO_URL: ${ODOO_URL}
      POSTGRES_HOST: db
      POSTGRES_DB: tarik
      POSTGRES_USER: tarik
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TARIK_PROMPTS_KEEP_DAYS: "30"
    volumes: # the code, mounted (a change needs a restart, not a build); never vault/ nor .env
      - ./server.py:/app/server.py
      - ./check.py:/app/check.py
      - ./run.py:/app/run.py
      - ./engine:/app/engine
      - ./tarik:/app/tarik
      - ./ui:/app/ui
      - ./content:/app/content
      - ./tests:/app/tests
      - ./pytest.ini:/app/pytest.ini
      - ./pyproject.toml:/app/pyproject.toml
      - ./vault/.local/approle:/run/vault:ro # the AppRole: it may only read secret/tarik/*
    depends_on: [db, vault]
    dns: [1.1.1.1, 8.8.8.8]

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: tarik
      POSTGRES_USER: tarik
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql/data

  vault:
    image: hashicorp/vault:1.18.3
    restart: unless-stopped
    entrypoint: ["sh", "/vault/config/start.sh"]
    ports:
      - "127.0.0.1:8200:8200" # for the setup scripts on this machine, not the LAN
    volumes:
      - ./vault/config.hcl:/vault/config/config.hcl:ro
      - ./vault/start.sh:/vault/config/start.sh:ro
      - ./vault/setup.sh:/vault/config/setup.sh:ro
      - ./vault/.local/unseal:/vault/unseal # unseal key and root token: this machine only, never in git
      - ./vault/.local/approle:/vault/approle
      - vault_data:/vault/file

volumes:
  db_data:
    name: orchestrator_db_data # its data, from when it was the orchestrator's stack
  vault_data:
