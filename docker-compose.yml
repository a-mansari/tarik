services:
  n8n:
    build: ./n8n # n8n 2.43.5 with Tarik's patches (n8n/patch.js)
    restart: unless-stopped
    ports:
      - "127.0.0.1:5678:5678" # local only, not exposed on the LAN
    env_file: .env
    # Public resolvers: right after a restart the host's DNS sometimes failed (EAI_AGAIN api.minimax.io).
    # Service names (tarik-mcp, postgres) still resolve through Docker's own DNS.
    dns: [1.1.1.1, 8.8.8.8]
    environment:
      GENERIC_TIMEZONE: Africa/Casablanca
      TZ: Africa/Casablanca
      N8N_HOST: localhost
      N8N_PROTOCOL: http
      WEBHOOK_URL: http://localhost:5678/
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
    volumes:
      - n8n_data:/home/node/.n8n

  # Tarik's Odoo tools over MCP. Reached by n8n at http://tarik-mcp:8000/mcp, not exposed to the host.
  tarik-mcp:
    build: ./mcp
    restart: unless-stopped
    env_file: .env
    dns: [1.1.1.1, 8.8.8.8]

  # Wakes "Tarik - Emails" as soon as an email arrives (IMAP IDLE), instead of at its next 2-minute check.
  tarik-mail-watch:
    build: ./mcp
    restart: unless-stopped
    env_file: .env
    dns: [1.1.1.1, 8.8.8.8]
    command: ["python", "watcher.py"]

  # Tarik's chat memory (Postgres Chat Memory node). Not exposed to the host.
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres:/docker-entrypoint-initdb.d:ro # runs on a fresh volume only

volumes:
  n8n_data:
  postgres_data:
