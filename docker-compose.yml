# Tarik: the server (the graphs, the agent, the tools, the mail watcher, the UI), its Postgres (runs, conversations,
# each cabinet's schema) and Vault (Tarik's settings and secrets, vault/; read-only for the server, but the Cabinets page's own role). Its .env (from
# .env.example, never in git) gives POSTGRES_PASSWORD and ODOO_URL:
#   docker compose up --build -d
# The project keeps the name sarnec-n8n, and the database its volume: the names of the stacks they came from (Vault's
# data is in sarnec-n8n_vault_data). The n8n implementation is retired (branch main); its data backed up, not here.
# This file is for development (the code mounted); the deployment is docker-compose.prod.yml, see DEPLOY.md.
name: sarnec-n8n

services:
  server:
    image: tarik
    container_name: tarik-server
    build:
      context: .
      args: # the Claude Code CLI's installer (.env.example); INSTALL_CLAUDE_CODE=0 leaves it out
        INSTALL_CLAUDE_CODE: ${INSTALL_CLAUDE_CODE:-1}
        CLAUDE_INSTALL_URL: ${CLAUDE_INSTALL_URL:-}
        CLAUDE_CODE_VERSION: ${CLAUDE_CODE_VERSION:-}
    command: ["python", "-m", "server"] # as the image's own, for an image built before server/ held the server
    restart: unless-stopped
    ports:
      - "${TARIK_BIND:-127.0.0.1}:${TARIK_PORT:-2024}:2024" # server/server.py, local only unless TARIK_BIND says so
    environment:
      VAULT_ADDR: ${VAULT_ADDR:?VAULT_ADDR is required (.env), http://vault:8200 for the bundled Vault}
      TARIK_DEFAULT_CABINET: ${TARIK_DEFAULT_CABINET:?TARIK_DEFAULT_CABINET is required (.env)}
      ODOO_URL: ${ODOO_URL}
      TARIK_MODEL_URL: ${TARIK_MODEL_URL:?TARIK_MODEL_URL is required (.env)}
      TARIK_GRAPH_TOKEN: ${TARIK_GRAPH_TOKEN:-} # scripts' bearer token (run.py); empty: none accepted
      TARIK_TRUSTED_PROXIES: ${TARIK_TRUSTED_PROXIES:-*}
      POSTGRES_HOST: ${POSTGRES_HOST:-db}
      POSTGRES_DB: ${POSTGRES_DB:-tarik}
      POSTGRES_USER: ${POSTGRES_USER:-tarik}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TARIK_PROMPTS_KEEP_DAYS: ${TARIK_PROMPTS_KEEP_DAYS:-30}
      TARIK_CALLS_PER_CABINET: ${TARIK_CALLS_PER_CABINET:-10}
      TARIK_CALLS_TOTAL: ${TARIK_CALLS_TOTAL:-40}
      TARIK_MODEL_CALLS: ${TARIK_MODEL_CALLS:-10}
      HINDSIGHT_URL: ${HINDSIGHT_URL:-} # the memory (the hindsight service below, profile memory); empty: Tarik has none
    volumes: # the code, mounted (a change needs a restart, not a build); never vault/ nor .env
      - ./check.py:/app/check.py
      - ./run.py:/app/run.py
      - ./server:/app/server
      - ./engine:/app/engine
      - ./tests:/app/tests
      - ./pytest.ini:/app/pytest.ini
      - ./.env.example:/app/.env.example:ro # the deployment tests read it
      - ./pyproject.toml:/app/pyproject.toml
      - ./vault/.local/approle:/run/vault:ro # the AppRole: it may only read secret/tarik/*
      - ./vault/.local/settings-approle:/run/vault-settings:ro # the Cabinets page's: each cabinet's own settings only
    depends_on: [db, vault]
    dns: ["${DNS_PRIMARY:-1.1.1.1}", "${DNS_SECONDARY:-8.8.8.8}"] # the resolvers the container uses (.env, optional)

  db:
    image: pgvector/pgvector:pg17 # Postgres 17 with the pgvector extension (the memory's): same data files as postgres:17
    container_name: tarik-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tarik}
      POSTGRES_USER: ${POSTGRES_USER:-tarik}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql/data

  # Tarik's memory (engine/memory.py): off unless started with the "memory" profile and HINDSIGHT_URL set in .env
  #   docker compose --profile memory up -d
  # Its tables are the schema "hindsight" of the db above (pgvector); its fact extraction runs on a Claude Code subscription
  # token (HINDSIGHT_LLM_TOKEN: `claude setup-token`), its embeddings on a small multilingual model that runs inside.
  hindsight:
    profiles: ["memory"]
    image: tarik-hindsight
    build:
      context: deploy/hindsight
      args:
        CLAUDE_INSTALL_URL: ${CLAUDE_INSTALL_URL:-}
        CLAUDE_CODE_VERSION: ${CLAUDE_CODE_VERSION:-}
    restart: unless-stopped
    environment:
      HINDSIGHT_API_DATABASE_URL: postgresql://${POSTGRES_USER:-tarik}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-tarik}
      HINDSIGHT_API_DATABASE_SCHEMA: hindsight
      HINDSIGHT_API_DB_POOL_MIN_SIZE: "1" # its default is 5 to 100 connections: Postgres allows 100 in all, Tarik needs its own
      HINDSIGHT_API_DB_POOL_MAX_SIZE: "10"
      HINDSIGHT_API_LLM_PROVIDER: claude-code
      HINDSIGHT_API_LLM_MODEL: ${HINDSIGHT_LLM_MODEL:-sonnet}
      HINDSIGHT_API_LLM_API_KEY: ${HINDSIGHT_LLM_TOKEN:-} # needed to run the memory (.env); not required here: compose reads every service, run or not
      HINDSIGHT_API_EMBEDDINGS_PROVIDER: onnx # multilingual-e5-small: the cabinets write French
    depends_on: [db]

  vault:
    image: hashicorp/vault:1.18.3
    container_name: tarik-vault
    restart: unless-stopped
    entrypoint: ["sh", "/vault/config/start.sh"]
    ports:
      - "127.0.0.1:8200:8200" # for the setup scripts on this machine, not the LAN
    volumes:
      - ./vault/config.hcl:/vault/config/config.hcl:ro
      - ./vault/start.sh:/vault/config/start.sh:ro
      - ./vault/setup.sh:/vault/config/setup.sh:ro
      - ./vault/.local/unseal:/vault/unseal # unseal key and root token: this machine only, never in git
      - ./vault/.local/approle:/vault/approle
      - ./vault/.local/settings-approle:/vault/settings-approle
      - vault_data:/vault/file

volumes:
  db_data:
    name: orchestrator_db_data # its data, from when it was the orchestrator's stack
  vault_data:
