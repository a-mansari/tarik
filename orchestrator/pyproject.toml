# The orchestrator's one code style: ruff's formatter and linter, lines of 120 at most (tests/style checks both).
[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["ui/static/vendor"]

[tool.ruff.lint]
# pycodestyle, pyflakes, import order, modern idioms, likely bugs, simpler comprehensions and conditions.
select = ["E", "W", "F", "I", "UP", "B", "C4", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["tarik", "engine", "ui", "server", "check", "run", "tests", "shared", "conftest"]
