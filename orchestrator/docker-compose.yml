# Tarik's orchestrator, a stack of its own: the server (the graphs, the agent, the tools, the mail watcher, the UI)
# and its Postgres (runs, conversations, and each cabinet's schema). It reaches the shared Vault (read-only AppRole
# on secret/tarik/*) on the n8n stack's network, and nothing else of it. From this folder, its .env giving
# POSTGRES_PASSWORD and ODOO_URL:
#   docker compose up --build -d
services:
  server:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:2024:2024" # server.py, local only
    environment:
      VAULT_ADDR: http://vault:8200
      TARIK_DEFAULT_CABINET: experio_cabinet_8
      ODOO_URL: ${ODOO_URL}
      POSTGRES_HOST: db
      POSTGRES_DB: tarik
      POSTGRES_USER: tarik
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TARIK_PROMPTS_KEEP_DAYS: "30"
    volumes:
      - .:/app
      - ../vault/.local/approle:/run/vault:ro # the AppRole: it may only read secret/tarik/*
    depends_on: [db]
    networks: [default, vault]
    dns: [1.1.1.1, 8.8.8.8]

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: tarik
      POSTGRES_USER: tarik
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql/data

networks:
  vault: # the n8n stack's network, for its Vault only
    name: sarnec-n8n_default
    external: true

volumes:
  db_data:
