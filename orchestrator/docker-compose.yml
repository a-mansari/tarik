# Tarik's orchestrator, next to the n8n stack (whose docker-compose.yml is left alone): it joins that stack's network
# to reach tarik-mcp, Vault and Postgres (runs, steps and conversations: schema orchestrator). From the repository's
# root, its .env giving only the POSTGRES_* values:
#   docker compose -f orchestrator/docker-compose.yml --env-file .env up --build -d
services:
  tarik-orchestrator:
    build: .
    ports:
      - "127.0.0.1:2024:2024" # server.py, local only
    environment:
      VAULT_ADDR: http://vault:8200
      TARIK_MCP: http://tarik-mcp:8000
      TARIK_DEFAULT_CABINET: experio_cabinet_8
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - .:/app
      - ../vault/.local/approle:/run/vault:ro # tarik-mcp's AppRole: it may only read secret/tarik/*
      - ../instructions:/instructions:ro # the skills and the tools' prompts
      - ../workflows:/workflows:ro # check.py compares the graphs with the n8n workflows
    dns: [1.1.1.1, 8.8.8.8]
networks:
  default:
    name: sarnec-n8n_default
    external: true
