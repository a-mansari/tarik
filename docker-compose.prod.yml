# Tarik for a deployment (see DEPLOY.md): four containers (five with the memory profile), nothing to set up by hand.
#   server      the code (engine/ and server/ in one process), read-only AppRole logins from the volumes below
#   db          Postgres (or the platform's own: leave this one out with POSTGRES_HOST set)
#   vault       Vault, on this compose network only (no published port), unsealed again at each start from the
#               vault_keys volume
#   vault-init  one-shot at each start: initialises and unseals Vault the first time, makes the two AppRoles and their
#               login files
# The shared settings (mail server, model, Gladden, Sparrow...) are .env's; the cabinets are made on the Cabinets page. Every address, port and limit comes from .env (.env.example); nothing is written here.
#   docker compose -f docker-compose.prod.yml build
#   docker compose -f docker-compose.prod.yml up -d
name: tarik

services:
  server:
    image: ${TARIK_IMAGE:-tarik:latest}
    build:
      context: .
      args:
        INSTALL_CLAUDE_CODE: ${INSTALL_CLAUDE_CODE:-1}
        CLAUDE_INSTALL_URL: ${CLAUDE_INSTALL_URL:-https://claude.ai/install.sh}
        CLAUDE_CODE_VERSION: ${CLAUDE_CODE_VERSION:-2.1.300}
    command: ["python", "-m", "server"]
    restart: unless-stopped
    ports:
      - "${TARIK_BIND:-127.0.0.1}:${TARIK_PORT:-2024}:2024"
    environment:
      VAULT_ADDR: ${VAULT_ADDR:-http://vault:8200} # the bundled Vault; set it for another
      TARIK_DEFAULT_CABINET: ${TARIK_DEFAULT_CABINET:-}
      ODOO_URL: ${ODOO_URL:?ODOO_URL is required (.env)}
      TARIK_GRAPH_TOKEN: ${TARIK_GRAPH_TOKEN:-}
      TARIK_TRUSTED_PROXIES: ${TARIK_TRUSTED_PROXIES:?TARIK_TRUSTED_PROXIES is required (.env), the reverse proxy's address}
      POSTGRES_HOST: ${POSTGRES_HOST:-db}
      POSTGRES_DB: ${POSTGRES_DB:-tarik}
      POSTGRES_USER: ${POSTGRES_USER:-tarik}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required (.env)}
      TARIK_PROMPTS_KEEP_DAYS: ${TARIK_PROMPTS_KEEP_DAYS:-30}
      TARIK_CALLS_PER_CABINET: ${TARIK_CALLS_PER_CABINET:-10}
      TARIK_CALLS_TOTAL: ${TARIK_CALLS_TOTAL:-40}
      TARIK_MODEL_CALLS: ${TARIK_MODEL_CALLS:-10}
      HINDSIGHT_URL: ${HINDSIGHT_URL:-} # the memory (the hindsight service below, profile memory); empty: Tarik has none
      # The settings every cabinet shares (.env.example): read at start, a change means a restart.
      IMAP_HOST: ${IMAP_HOST:-}
      IMAP_PORT: ${IMAP_PORT:-993}
      IMAP_FOLDER: ${IMAP_FOLDER:-INBOX}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-465}
      MAIL_CERT_SHA256: ${MAIL_CERT_SHA256:-}
      MODEL_API_URL: ${MODEL_API_URL:-}
      MODEL_API_KEY: ${MODEL_API_KEY:-}
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}
      EXPERIO_API_KEY: ${EXPERIO_API_KEY:-}
      MEMORY_ENABLED: ${MEMORY_ENABLED:-}
      PUBLIC_URL: ${PUBLIC_URL:-}
      GLADDEN_URL: ${GLADDEN_URL:-}
      GLADDEN_CALLBACK_URL: ${GLADDEN_CALLBACK_URL:-}
      SPARROW_URL: ${SPARROW_URL:-}
      SPARROW_SENDER_ID: ${SPARROW_SENDER_ID:-}
      SPARROW_TOKEN: ${SPARROW_TOKEN:-}
    volumes:
      - vault_approle:/run/vault:ro # role_id, secret_id: reads secret/tarik/*
      - vault_settings_approle:/run/vault-settings:ro # the Cabinets page's: each cabinet's own settings only
    healthcheck: # GET /ok needs no login
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:2024/ok', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    depends_on:
      db:
        condition: service_started
      vault-init:
        condition: service_completed_successfully

  db:
    image: pgvector/pgvector:pg17 # Postgres 17 with the pgvector extension (the memory's): same data files as postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tarik}
      POSTGRES_USER: ${POSTGRES_USER:-tarik}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required (.env)}
    volumes:
      - db_data:/var/lib/postgresql/data

  # Tarik's memory (engine/memory.py): off unless started with the "memory" profile and HINDSIGHT_URL set in .env
  #   docker compose --profile memory up -d
  # Its tables are the schema "hindsight" of the db above (pgvector); its fact extraction runs on a Claude Code subscription
  # token (HINDSIGHT_LLM_TOKEN: `claude setup-token`), its embeddings on a small multilingual model that runs inside.
  hindsight:
    profiles: ["memory"]
    image: tarik-hindsight
    build:
      context: deploy/hindsight
      args:
        CLAUDE_INSTALL_URL: ${CLAUDE_INSTALL_URL:-https://claude.ai/install.sh}
        CLAUDE_CODE_VERSION: ${CLAUDE_CODE_VERSION:-2.1.300}
    restart: unless-stopped
    ports:
      - "127.0.0.1:9999:9999" # its web UI (read and delete the memories), this machine only: it has no login
    environment:
      HINDSIGHT_API_DATABASE_URL: postgresql://${POSTGRES_USER:-tarik}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-tarik}
      HINDSIGHT_API_DATABASE_SCHEMA: hindsight
      HINDSIGHT_API_DB_POOL_MIN_SIZE: "1" # its default is 5 to 100 connections: Postgres allows 100 in all, Tarik needs its own
      HINDSIGHT_API_DB_POOL_MAX_SIZE: "10"
      HINDSIGHT_API_LLM_PROVIDER: claude-code
      HINDSIGHT_API_LLM_MODEL: ${HINDSIGHT_LLM_MODEL:-sonnet}
      HINDSIGHT_API_LLM_API_KEY: ${HINDSIGHT_LLM_TOKEN:-} # needed to run the memory (.env); not required here: compose reads every service, run or not
      HINDSIGHT_API_EMBEDDINGS_PROVIDER: onnx # multilingual-e5-small: the cabinets write French
    depends_on: [db]

  vault:
    image: hashicorp/vault:1.18.3
    restart: unless-stopped
    entrypoint: ["sh", "/vault/config/start.sh"]
    volumes:
      - ./vault/config.hcl:/vault/config/config.hcl:ro
      - ./vault/start.sh:/vault/config/start.sh:ro
      - vault_keys:/vault/unseal:ro # the unseal key and root token, made by vault-init
      - vault_data:/vault/file
    healthcheck: # up, sealed or not (vault status: 0 unsealed, 2 sealed, 1 down)
      test: ["CMD", "sh", "-c", "VAULT_ADDR=http://127.0.0.1:8200 vault status >/dev/null 2>&1; [ $$? -ne 1 ]"]
      interval: 5s
      timeout: 5s
      retries: 20

  vault-init:
    image: hashicorp/vault:1.18.3
    restart: "no"
    entrypoint: ["sh", "/vault/config/setup.sh"]
    environment:
      VAULT_ADDR: http://vault:8200 # the Vault container, on this network
    volumes:
      - ./vault/setup.sh:/vault/config/setup.sh:ro
      - vault_keys:/vault/unseal
      - vault_approle:/vault/approle
      - vault_settings_approle:/vault/settings-approle
    depends_on:
      vault:
        condition: service_healthy

volumes:
  db_data:
  vault_data:
  vault_keys: # the unseal key and root token: back it up with vault_data, and keep it private to the Vault containers
  vault_approle:
  vault_settings_approle:
