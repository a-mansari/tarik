[pytest]
# Run from the host with tests/run.py: only the tests that cover what changed, in a throwaway tarik-mcp container.
pythonpath = .
testpaths = tests
# Each test has one category; live and llm tests (the real n8n or model, slow, billed) run only when asked:
# -m live, -m llm.
markers =
    security: isolation between cabinets, secrets never shown, whitelist and sender checks, only the client's own words or choices decide
    functionality: what Tarik does for the cabinet
    communication: what the client or the agent is told, and how
    technical: plumbing: Vault, concurrency, encodings, PDF handling
    style: the code and the generated files kept consistent (lint, workflows rebuilt from their scripts, tool names)
    live: talks to the running n8n and the real model
    llm: the real model's decisions, measured on many replies (slow, billed): their accuracy on average
addopts = --strict-markers -m "not live and not llm"
